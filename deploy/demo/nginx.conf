server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index pages/overview.html;

    location = / { return 302 /web/overview; }
    location = /web { return 302 /web/overview; }
    location = /mobile { return 302 /mobile/home; }
    location = /小程序 { return 302 /mobile/home; }
    location = /worker { return 302 /worker/tasks; }
    location = /web/media/weekly { return 302 /web/media; }

    location ~ ^/web/(overview|work-orders|expenses|finance|media|broadcast|group)$ {
        rewrite ^/web/(.+)$ /pages/$1.html last;
    }
    location = /web/login { rewrite ^ /pages/login.html last; }

    location ~ ^/worker/(checkin|tasks)$ {
        rewrite ^/worker/(.+)$ /pages/$1.html last;
    }
    location = /worker/login { rewrite ^ /pages/login.html last; }

    location ~ ^/mobile/(home|login|verify|review|media|services|bills|repair|profile|billing|points)$ {
        rewrite ^/mobile/(.+)$ /pages/$1.html last;
    }

    location ~ ^/web/orders/[^/]+$ { rewrite ^ /pages/work-orders.html last; }
    location ~ ^/worker/orders/[^/]+$ { rewrite ^ /pages/tasks.html last; }
    location ~ ^/mobile/articles/[^/]+$ { rewrite ^ /pages/media.html last; }
    location ~ ^/mobile/services/[^/]+$ { rewrite ^ /pages/services.html last; }

    location / {
        try_files $uri =404;
    }
}
