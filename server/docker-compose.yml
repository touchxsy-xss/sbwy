services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shengbian
      POSTGRES_PASSWORD: shengbian_dev
      POSTGRES_DB: shengbian
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shengbian-postgres:/var/lib/postgresql/data

volumes:
  shengbian-postgres:
